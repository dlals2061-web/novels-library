<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 공개 주소는 유지하되 검색 결과에는 노출하지 않는다. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="선택에 따라 문장, 장면, 결말이 달라지는 순수 텍스트 반응형 소설"
    />
    <meta name="theme-color" content="#f7f2e8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="마지막 편지" />
    <link rel="manifest" href="../../manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <title>마지막 편지를 대신 쓰는 일 | 반응형 소설</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="reader">
      <header class="reader-header">
        <div>
          <p class="kicker">선택으로 읽는 소설</p>
          <h1 id="novelTitle">마지막 편지를 대신 쓰는 일</h1>
        </div>
        <div class="header-actions">
          <a class="library-link" href="../../index.html" title="작품 목록으로 돌아가기" aria-label="작품 목록으로 돌아가기">&larr;</a>
          <button id="installButton" class="install-button" type="button" hidden>설치</button>
          <button id="restartButton" type="button">기록 지우고 처음부터</button>
        </div>
      </header>

      <section class="chapter-meta" aria-label="현재 장면 정보">
        <span id="chapterLabel">1부 1장</span>
        <span id="threadLabel">공방의 규칙</span>
      </section>

      <nav class="tabs" aria-label="소설 정보" role="tablist">
        <button class="tab is-active" id="storyTab" type="button" role="tab" data-tab="story" aria-controls="storyPanel" aria-selected="true">본문</button>
        <button class="tab" id="relationshipsTab" type="button" role="tab" data-tab="relationships" aria-controls="relationshipsPanel" aria-selected="false">관계</button>
        <button class="tab" id="memoryTab" type="button" role="tab" data-tab="memory" aria-controls="memoryPanel" aria-selected="false">기록</button>
      </nav>

      <section id="storyPanel" role="tabpanel" aria-labelledby="storyTab" aria-live="polite">
        <article class="page">
          <h2 id="sceneTitle" tabindex="-1"></h2>
          <div class="prose" id="storyText"></div>
        </article>

        <nav class="choices" id="choices" aria-label="선택지"></nav>
      </section>

      <section class="panel" id="relationshipsPanel" role="tabpanel" aria-labelledby="relationshipsTab" hidden>
        <div class="panel-heading">
          <h2>관계의 온도</h2>
          <p>서윤이 실제로 마주친 사람들과의 거리를 남겨 둡니다.</p>
        </div>
        <div class="relationship-list" id="relationshipList"></div>
      </section>

      <section class="panel" id="memoryPanel" role="tabpanel" aria-labelledby="memoryTab" hidden>
        <div class="panel-heading">
          <h2>남은 흔적</h2>
          <p>서윤이 보관한 문장, 손에 쥔 단서, 아직 대답하지 못한 질문을 모아 둡니다.</p>
        </div>
        <div class="memory-list" id="memoryList"></div>
      </section>
    </main>

    <dialog class="install-dialog" id="installDialog" aria-labelledby="installDialogTitle">
      <div>
        <p class="kicker">홈 화면</p>
        <h2 id="installDialogTitle">마지막 편지를 대신 쓰는 일</h2>
        <p>Safari의 공유 메뉴에서 ‘홈 화면에 추가’를 선택하면 책장처럼 꺼내 읽을 수 있습니다.</p>
      </div>
      <button id="closeInstallDialog" type="button">닫기</button>
    </dialog>

    <script src="./story-data.js"></script>
    <script src="./novel.js"></script>
  </body>
</html>
