<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 공개 주소는 유지하되 검색 결과에는 노출하지 않는다. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="선택에 따라 관계와 기록, 결말이 달라지는 심리 미스터리 반응형 소설" />
    <meta name="theme-color" content="#f5f3ed" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="빛이 닿지 않은 사진" />
    <link rel="manifest" href="../../manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="../../reader-tools.css" />
    <link rel="stylesheet" href="../../design-system.css" />
    <title>빛이 닿지 않은 사진 | 반응형 소설</title>
  </head>
  <body>
    <main class="reader">
      <header class="reader-header">
        <a class="library-link" href="../../index.html" title="작품 목록으로 돌아가기" aria-label="작품 목록으로 돌아가기">서가</a>
        <div class="reader-title-lockup">
          <img class="reader-cover" src="../../covers/lightless-photos-cover.webp" alt="" width="400" height="600" decoding="async" />
          <div>
            <p class="kicker">선택으로 읽는 심리 미스터리</p>
            <h1 id="novelTitle">빛이 닿지 않은 사진</h1>
          </div>
        </div>
        <div class="header-actions">
          <button id="installButton" class="install-button" type="button" hidden>설치</button>
          <button id="restartButton" type="button">처음부터</button>
        </div>
      </header>

      <section class="chapter-meta" aria-label="현재 장면 정보">
        <span id="chapterLabel"></span>
        <span id="threadLabel"></span>
      </section>

      <nav class="tabs" aria-label="소설 정보" role="tablist">
        <button class="tab is-active" id="storyTab" type="button" role="tab" data-tab="story" aria-controls="storyPanel" aria-selected="true">본문</button>
        <button class="tab" id="relationshipsTab" type="button" role="tab" data-tab="relationships" aria-controls="relationshipsPanel" aria-selected="false">관계</button>
        <button class="tab" id="memoryTab" type="button" role="tab" data-tab="memory" aria-controls="memoryPanel" aria-selected="false">기록</button>
      </nav>

      <section id="storyPanel" role="tabpanel" aria-labelledby="storyTab" aria-live="polite">
        <article class="page">
          <p id="choiceEcho" class="choice-echo" hidden></p>
          <h2 id="sceneTitle" tabindex="-1"></h2>
          <div class="prose" id="storyText"></div>
        </article>
        <nav class="choices" id="choices" aria-label="선택지"></nav>
      </section>

      <section class="panel" id="relationshipsPanel" role="tabpanel" aria-labelledby="relationshipsTab" hidden>
        <div class="panel-heading">
          <h2>관계</h2>
          <p>현재까지 서린이 실제로 만난 사람과, 확인된 거리만 남겨 둡니다.</p>
        </div>
        <div class="relationship-list" id="relationshipList"></div>
      </section>

      <section class="panel" id="memoryPanel" role="tabpanel" aria-labelledby="memoryTab" hidden>
        <div class="panel-heading">
          <h2>기록</h2>
          <p>선택한 문장과 손에 남은 단서를 정리합니다.</p>
        </div>
        <div class="memory-list" id="memoryList"></div>
      </section>
    </main>

    <dialog class="install-dialog" id="installDialog" aria-labelledby="installDialogTitle">
      <div>
        <p class="kicker">홈 화면</p>
        <h2 id="installDialogTitle">빛이 닿지 않은 사진</h2>
        <p>Safari에서는 공유 메뉴의 ‘홈 화면에 추가’를 선택하면 독립된 앱처럼 읽을 수 있습니다.</p>
      </div>
      <button id="closeInstallDialog" type="button">닫기</button>
    </dialog>

    <script src="./story-data.js"></script>
    <script src="../../reader-tools.js"></script>
    <script src="./novel.js"></script>
  </body>
</html>
