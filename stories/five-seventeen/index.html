<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f3f0e8" />
  <link rel="manifest" href="../../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../../icons/icon-180.png" />
  <link rel="stylesheet" href="../../design-system.css" />
  <link rel="stylesheet" href="../../reader-tools.css" />
  <link rel="stylesheet" href="./styles.css" />
  <title>오후 5시 17분의 우리</title>
</head>
<body>
  <main class="reader five-seventeen-reader">
    <header class="reader-header">
      <a class="library-link" href="../../index.html" aria-label="작품 목록으로 돌아가기">서가</a>
      <div class="reader-title-lockup">
        <img class="story-mark-cover" src="../../covers/five-seventeen-cover.webp" alt="" width="400" height="600" decoding="async" />
        <div><p class="kicker">선택으로 읽는 청소년 로맨스</p><h1>오후 5시 17분의 우리</h1></div>
      </div>
      <div class="header-actions"><button id="restartButton" type="button">처음부터</button></div>
    </header>

    <div class="chapter-meta"><span id="chapterLabel"></span><span id="threadLabel"></span></div>
    <nav class="tabs" aria-label="소설 정보" role="tablist">
      <button class="tab is-active" type="button" role="tab" data-tab="story" aria-controls="storyPanel" aria-selected="true">본문</button>
      <button class="tab" type="button" role="tab" data-tab="relationships" aria-controls="relationshipsPanel" aria-selected="false">관계</button>
      <button class="tab" type="button" role="tab" data-tab="memory" aria-controls="memoryPanel" aria-selected="false">기록</button>
    </nav>

    <section id="storyPanel" role="tabpanel" aria-live="polite">
      <article class="page"><h2 id="sceneTitle" tabindex="-1"></h2><div id="storyText" class="prose"></div></article>
      <nav id="choices" class="choices" aria-label="선택지"></nav>
    </section>

    <section class="panel" id="relationshipsPanel" role="tabpanel" hidden>
      <div class="panel-heading"><h2>우리 사이의 주파수</h2><p>봄이 이름을 알고 다시 마주한 사람들의 현재를 보여 줍니다.</p></div>
      <div id="relationshipList" class="relationship-list"></div>
    </section>

    <section class="panel" id="memoryPanel" role="tabpanel" hidden>
      <div class="panel-heading"><h2>남겨 둔 문장</h2><p>지금까지 선택한 말과 그때의 장면을 순서대로 보관합니다.</p></div>
      <div id="memoryList" class="memory-list"></div>
    </section>
  </main>
  <script src="./story-data.js"></script>
  <script src="../../reader-tools.js"></script>
  <script src="./novel.js"></script>
</body>
</html>
